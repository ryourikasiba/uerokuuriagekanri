<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>週間売上日報シート（Firebaseクラウド連携版）</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 20px; border-bottom: 3px solid #2980b9; padding-bottom: 10px; }
        h2 { font-size: 16px; color: #2c3e50; margin-top: 25px; margin-bottom: 10px; background: #e1f5fe; padding: 8px; border-left: 5px solid #0288d1; }
        h2.vending-title { background: #fffde7; border-left: 5px solid #fbc02d; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #2c3e50; }
        .tab-btn { background: #e2e8f0; color: #2c3e50; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 14px; }
        .tab-btn.active { background: #2c3e50; color: white; }
        .page-content { display: none; }
        .page-content.active { display: block; }
        
        .control-panel { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; background: #eef2f5; padding: 15px; border-radius: 6px; flex-wrap: wrap; }
        label { font-weight: bold; }
        input[type="date"], input[type="text"], input[type="number"], select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        
        button { border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-cloud-save { background: #e74c3c; color: white; margin-left: auto; } /* クラウド保存ボタンを目立たせる */
        .btn-cloud-save:hover { background: #c0392b; }
        .btn-cloud-load { background: #9b59b6; color: white; }
        .btn-cloud-load:hover { background: #8e44ad; }
        .btn-csv { background: #2ecc71; color: white; }
        
        .btn-add { background: #2c3e50; color: white; padding: 6px 15px; }
        .btn-danger { background: #e74c3c; color: white; padding: 2px 6px; font-size: 11px; font-weight: normal; }
        .btn-edit { background: #f39c12; color: white; padding: 2px 6px; font-size: 11px; font-weight: normal; margin-right: 2px; }
        
        .master-section { background: #f8f9fa; padding: 20px; border: 1px solid #dcdde1; border-radius: 6px; }
        .master-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .master-column { background: white; padding: 15px; border: 1px solid #e2e8f0; border-radius: 6px; }
        .master-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 500px; overflow-y: auto; }
        .master-item { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; }
        th, td { border: 1px solid #b2bec3; padding: 6px 4px; text-align: center; }
        th { background: #f1f2f6; color: #2c3e50; font-weight: bold; }
        .day-header { background: #dfe4ea; font-size: 13px; }
        .prod-col { background: #f8f9fa; text-align: left; font-weight: bold; padding-left: 8px; width: 180px; }
        .calc-cell { background: #fafafa; color: #555; }
        .total-col { background: #e8f4f8; font-weight: bold; width: 80px; }
        .grand-total-row { background: #dfe4ea; font-weight: bold; }
        
        .input-num { width: 40px; text-align: right; padding: 2px; border: 1px solid #ccc; border-radius: 3px; }
        .summary-box { background: #2c3e50; color: white; padding: 15px 20px; border-radius: 6px; margin-top: 30px; display: flex; justify-content: space-between; align-items: center; }
        .summary-box .price-display { font-size: 24px; font-weight: bold; color: #f1c40f; }
        .cloud-status { font-size: 12px; color: #7f8c8d; margin-left: 10px; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 週間売上日報一括管理システム <span id="sync-status" class="cloud-status">☁️ クラウド未接続</span></h1>
    
    <div class="tabs">
        <button id="tab-input" class="tab-btn active" onclick="switchPage('input')">📅 日報入力画面</button>
        <button id="tab-master" class="tab-btn" onclick="switchPage('master')">⚙️ 商品マスター管理ページ</button>
    </div>

    <div id="page-input" class="page-content active">
        <div class="control-panel">
            <label>対象の週：</label>
            <input type="date" id="week-start" onchange="loadOrCreateSheet()">
            
            <button class="btn-cloud-load" onclick="loadFromCloud()">🔄 クラウドから読込</button>
            <button class="btn-csv" onclick="exportToCSV()">📥 CSV出力</button>
            <button class="btn-cloud-save" onclick="saveToCloud()">🚀 クラウドに本保存</button>
        </div>

        <h2>🥖 【上段】手売り販売商品（製造数と残数から販売数を計算）</h2>
        <div id="hand-table-space"></div>

        <h2 class="vending-title">🎫 【下段】券売機販売商品（3台の券売機から販売数を直接入力）</h2>
        <div id="vending-table-space"></div>

        <div class="summary-box">
            <h3>🏪 店舗 週間総合計（手売り売上 ＋ 券売機売上）</h3>
            <div id="grand-total-display" class="price-display">0 円</div>
        </div>
    </div>

    <div id="page-master" class="page-content">
        <div class="master-section">
            <h3>➕ 新規商品の追加登録</h3>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: white; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0;">
                <select id="new-type"><option value="hand">手売り商品</option><option value="vending">券売機商品</option></select>
                <input type="text" id="new-name" placeholder="商品名" style="width: 250px;">
                <input type="number" id="new-price" placeholder="単価（円）" style="width: 120px;">
                <button class="btn-add" onclick="addMasterItem()">追加登録する</button>
                <button class="btn-cloud-save" onclick="saveMasterToCloud()" style="margin-left: auto;">⚙️ マスターをクラウドに保存</button>
            </div>
            
            <div class="master-grid">
                <div class="master-column" style="border-top: 4px solid #0288d1;">
                    <h4 style="margin: 0 0 10px 0; color: #0288d1;">🥖 手売り商品 一覧</h4>
                    <div class="master-list" id="hand-master-list"></div>
                </div>
                <div class="master-column" style="border-top: 4px solid #fbc02d;">
                    <h4 style="margin: 0 0 10px 0; color: #fbc02d;">🎫 券売機商品 一覧</h4>
                    <div class="master-list" id="vending-master-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // デフォルトの初期マスターデータ
    const initialHand = [
        { name: "プレミアム食パン", price: 450 }, { name: "特製あんパン", price: 180 },
        { name: "サクサク メロンパン", price: 160 }, { name: "濃厚クリームパン", price: 170 },
        { name: "極みカレーパン", price: 220 }, { name: "クロワッサン", price: 200 }
    ];
    const initialVending = [
        { name: "醤油ラーメン（券）", price: 750 }, { name: "味噌ラーメン（券）", price: 800 }
    ];

    let handProducts = JSON.parse(localStorage.getItem('nippo_m_hand_v6')) || initialHand;
    let vendingProducts = JSON.parse(localStorage.getItem('nippo_m_vending_v6')) || initialVending;
    const dayNames = ["月", "火", "水", "木", "金", "土"];
    let currentWeekDates = [];
    let savedData = { hand: {}, vending: {} };

    window.onload = () => {
        const today = new Date();
        const day = today.getDay();
        const diff = today.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(today.setDate(diff));
        document.getElementById('week-start').value = monday.toISOString().split('T')[0];
        
        renderMasterLists();
        loadOrCreateSheet();
    };

    function switchPage(pageName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
        if (pageName === 'input') {
            document.getElementById('tab-input').classList.add('active');
            document.getElementById('page-input').classList.add('active');
        } else {
            document.getElementById('tab-master').classList.add('active');
            document.getElementById('page-master').classList.add('active');
        }
    }

    function renderMasterLists() {
        const handSpace = document.getElementById('hand-master-list');
        const vendSpace = document.getElementById('vending-master-list');
        handSpace.innerHTML = ''; vendSpace.innerHTML = '';
        
        handProducts.forEach((p, idx) => {
            handSpace.innerHTML += `<div class="master-item"><span><strong>${p.name}</strong> (${p.price}円)</span><div><button class="btn-edit" onclick="editMasterItem('hand', ${idx})">改定</button><button class="btn-danger" onclick="deleteMasterItem('hand', ${idx})">×</button></div></div>`;
        });
        vendingProducts.forEach((p, idx) => {
            vendSpace.innerHTML += `<div class="master-item"><span><strong>${p.name}</strong> (${p.price}円)</span><div><button class="btn-edit" onclick="editMasterItem('vending', ${idx})">改定</button><button class="btn-danger" onclick="deleteMasterItem('vending', ${idx})">×</button></div></div>`;
        });
    }

    function addMasterItem() {
        const type = document.getElementById('new-type').value;
        const name = document.getElementById('new-name').value.trim();
        const price = parseInt(document.getElementById('new-price').value);
        if (!name || isNaN(price)) return alert('正しい商品名と単価を入力してください。');
        if (type === 'hand') { handProducts.push({ name, price }); localStorage.setItem('nippo_m_hand_v6', JSON.stringify(handProducts)); }
        else { vendingProducts.push({ name, price }); localStorage.setItem('nippo_m_vending_v6', JSON.stringify(vendingProducts)); }
        document.getElementById('new-name').value = ''; document.getElementById('new-price').value = '';
        renderMasterLists(); renderTables();
    }

    function editMasterItem(type, idx) {
        const list = (type === 'hand') ? handProducts : vendingProducts;
        const current = list[idx];
        const newName = prompt("新しい商品名：", current.name); if (newName === null) return;
        const newPriceStr = prompt("新しい単価（円）：", current.price); if (newPriceStr === null) return;
        const newPrice = parseInt(newPriceStr);
        if (!newName.trim() || isNaN(newPrice)) return alert("入力内容に誤りがあります。");
        list[idx] = { name: newName.trim(), price: newPrice };
        localStorage.setItem(type === 'hand' ? 'nippo_m_hand_v6' : 'nippo_m_vending_v6', JSON.stringify(list));
        renderMasterLists(); renderTables();
    }

     Tar
    function deleteMasterItem(type, idx) {
        if (!confirm("この商品を削除しますか？")) return;
        if (type === 'hand') { handProducts.splice(idx, 1); localStorage.setItem('nippo_m_hand_v6', JSON.stringify(handProducts)); }
        else { vendingProducts.splice(idx, 1); localStorage.setItem('nippo_m_vending_v6', JSON.stringify(vendingProducts)); }
        renderMasterLists(); renderTables();
    }

    function loadOrCreateSheet() {
        const startStr = document.getElementById('week-start').value;
        if (!startStr) return;
        currentWeekDates = [];
        let baseDate = new Date(startStr);
        for (let i = 0; i < 6; i++) {
            const d = new Date(baseDate); d.setDate(baseDate.getDate() + i);
            currentWeekDates.push(d.toISOString().split('T')[0]);
        }
        renderTables();
        // 週を切り替えたら、自動でクラウドから最新データを引っ張ってくるように誘導
        document.getElementById('sync-status').innerText = "☁️ クラウド同期準備完了 (読み込みを押してください)";
    }

    function renderTables() {
        let totalHandAmt = 0, totalVendingAmt = 0;

        // 手売り
        let hHtml = `<table><thead><tr><th rowspan="2">商品名（単価）</th>`;
        currentWeekDates.forEach((date, i) => { hHtml += `<th colspan="4" class="day-header">${date.substring(5)} (${dayNames[i]})</th>`; });
        hHtml += `<th colspan="3" style="background:#d4e6f1;">週間横計</th></tr><tr>`;
        currentWeekDates.forEach(() => { hHtml += `<th>製造</th><th>残数</th><th>販売</th><th>売上</th>`; });
        hHtml += `<th>総製造</th><th>総販売</th><th>総売上</th></tr></thead><tbody>`;

        let hColTotals = currentWeekDates.map(() => ({ prod: 0, rem: 0, sale: 0, amt: 0 }));
        let hGrandProd = 0, hGrandSale = 0;

        handProducts.forEach((p, idx) => {
            hHtml += `<tr data-idx="${idx}"><td class="prod-col">${p.name}<br><small>(${p.price}円)</small></td>`;
            let rProd = 0, rSale = 0, rAmt = 0;
            currentWeekDates.forEach((date, dIdx) => {
                const data = savedData.hand[`${date}_${idx}`] || { prod: 0, rem: 0 };
                let sale = data.prod - data.rem; if (sale < 0) sale = 0; let amt = sale * p.price;
                rProd += data.prod; rSale += sale; rAmt += amt;
                hColTotals[dIdx].prod += data.prod; hColTotals[dIdx].rem += data.rem; hColTotals[dIdx].sale += sale; hColTotals[dIdx].amt += amt;
                hHtml += `
                    <td><input type="number" class="input-num hp-p" data-date="${date}" value="${data.prod}" onchange="reCalc()"></td>
                    <td><input type="number" class="input-num hp-r" data-date="${date}" value="${data.rem}" onchange="reCalc()"></td>
                    <td class="calc-cell">${sale}</td><td class="calc-cell">${amt.toLocaleString()}</td>
                `;
            });
            hHtml += `<td class="total-col">${rProd}</td><td class="total-col">${rSale}</td><td class="total-col" style="background:#d4e6f1;">${rAmt.toLocaleString()}</td></tr>`;
            totalHandAmt += rAmt; hGrandProd += rProd; hGrandSale += rSale;
        });
        hHtml += `<tr class="grand-total-row"><td>【手売 小計】</td>`;
        hColTotals.forEach(t => { hHtml += `<td>${t.prod}</td><td>${t.rem}</td><td>${t.sale}</td><td>${t.amt.toLocaleString()}</td>`; });
        hHtml += `<td>${hGrandProd}</td><td>${hGrandSale}</td><td style="background:#85c1e9;">${totalHandAmt.toLocaleString()}</td></tr></tbody></table>`;
        document.getElementById('hand-table-space').innerHTML = hHtml;

        // 券売機
        let vHtml = `<table><thead><tr><th rowspan="2">商品名（単価）</th>`;
        currentWeekDates.forEach((date, i) => { vHtml += `<th colspan="5" class="day-header">${date.substring(5)} (${dayNames[i]})</th>`; });
        vHtml += `<th colspan="5" style="background:#fcf3cf;">週間横計</th></tr><tr>`;
        currentWeekDates.forEach(() => { vHtml += `<th>1台</th><th>2台</th><th>3台</th><th>計</th><th>売上</th>`; });
        vHtml += `<th>1台計</th><th>2台計</th><th>3台計</th><th>総販売</th><th>総売上</th></tr></thead><tbody>`;

        let vColTotals = currentWeekDates.map(() => ({ v1: 0, v2: 0, v3: 0, tot: 0, amt: 0 }));
        let vGrandV1 = 0, vGrandV2 = 0, vGrandV3 = 0, vGrandTot = 0;

        vendingProducts.forEach((p, idx) => {
            vHtml += `<tr data-idx="${idx}"><td class="prod-col">${p.name}<br><small>(${p.price}円)</small></td>`;
            let rV1 = 0, rV2 = 0, rV3 = 0, rTot = 0, rAmt = 0;
            currentWeekDates.forEach((date, dIdx) => {
                const data = savedData.vending[`${date}_${idx}`] || { v1: 0, v2: 0, v3: 0 };
                let tot = data.v1 + data.v2 + data.v3; let amt = tot * p.price;
                rV1 += data.v1; rV2 += data.v2; rV3 += data.v3; rTot += tot; rAmt += amt;
                vColTotals[dIdx].v1 += data.v1; vColTotals[dIdx].v2 += data.v2; vColTotals[dIdx].v3 += data.v3; vColTotals[dIdx].tot += tot; vColTotals[dIdx].amt += amt;
                vHtml += `
                    <td><input type="number" class="input-num vp-1" data-date="${date}" value="${data.v1}" onchange="reCalc()"></td>
                    <td><input type="number" class="input-num vp-2" data-date="${date}" value="${data.v2}" onchange="reCalc()"></td>
                    <td><input type="number" class="input-num vp-3" data-date="${date}" value="${data.v3}" onchange="reCalc()"></td>
                    <td class="calc-cell">${tot}</td><td class="calc-cell">${amt.toLocaleString()}</td>
                `;
            });
            vHtml += `<td class="total-col">${rV1}</td><td class="total-col">${rV2}</td><td class="total-col">${rV3}</td><td class="total-col">${rTot}</td><td class="total-col" style="background:#f9e79f;">${rAmt.toLocaleString()}</td></tr>`;
            totalVendingAmt += rAmt; vGrandV1 += rV1; vGrandV2 += rV2; vGrandV3 += rV3; vGrandTot += rTot;
        });
        vHtml += `<tr class="grand-total-row"><td>【券売 小計】</td>`;
        vColTotals.forEach(t => { vHtml += `<td>${t.v1}</td><td>${t.v2}</td><td>${t.v3}</td><td>${t.tot}</td><td>${t.amt.toLocaleString()}</td>`; });
        vHtml += `<td>${vGrandV1}</td><td>${vGrandV2}</td><td>${vGrandV3}</td><td>${vGrandTot}</td><td style="background:#f7dc6f;">${totalVendingAmt.toLocaleString()}</td></tr></tbody></table>`;
        document.getElementById('vending-table-space').innerHTML = vHtml;

        document.getElementById('grand-total-display').innerText = (totalHandAmt + totalVendingAmt).toLocaleString() + " 円";
    }

    function reCalc() {
        document.querySelectorAll("#hand-table-space tbody tr:not(.grand-total-row)").forEach(row => {
            const idx = row.getAttribute('data-idx');
            currentWeekDates.forEach(date => {
                const p = parseInt(row.querySelector(`.hp-p[data-date="${date}"]`).value) || 0;
                const r = parseInt(row.querySelector(`.hp-r[data-date="${date}"]`).value) || 0;
                savedData.hand[`${date}_${idx}`] = { prod: p, rem: r };
            });
        });
        document.querySelectorAll("#vending-table-space tbody tr:not(.grand-total-row)").forEach(row => {
            const idx = row.getAttribute('data-idx');
            currentWeekDates.forEach(date => {
                const v1 = parseInt(row.querySelector(`.vp-1[data-date="${date}"]`).value) || 0;
                const v2 = parseInt(row.querySelector(`.vp-2[data-date="${date}"]`).value) || 0;
                const v3 = parseInt(row.querySelector(`.vp-3[data-date="${date}"]`).value) || 0;
                savedData.vending[`${date}_${idx}`] = { v1, v2, v3 };
            });
        });
        renderTables();
    }

    function exportToCSV() {
        let csv = "\uFEFF【手売り販売部門】\n商品名,単価,";
        currentWeekDates.forEach((date, i) => { csv += `${date}(${dayNames[i]})製造,${date}(${dayNames[i]})残数,${date}(${dayNames[i]})販売,${date}(${dayNames[i]})売上,`; });
        csv += "週間総製造,週間総販売,週間総売上\n";
        handProducts.forEach((p, idx) => {
            csv += `"${p.name}",${p.price},`; let rProd = 0, rSale = 0, rAmt = 0;
            currentWeekDates.forEach((date) => {
                const data = savedData.hand[`${date}_${idx}`] || { prod: 0, rem: 0 };
                let sale = data.prod - data.rem; if (sale < 0) sale = 0; let amt = sale * p.price;
                csv += `${data.prod},${data.rem},${sale},${amt},`; rProd += data.prod; rSale += sale; rAmt += amt;
            });
            csv += `${rProd},${rSale},${rAmt}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `売上日報_${document.getElementById('week-start').value}.csv`;
        link.click();
    }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDLJsp7ie4r8Kj5cXf_PIhcv_4XUMWdioU",
    authDomain: "uerokuuriagenipou.firebaseapp.com",
    projectId: "uerokuuriagenipou",
    storageBucket: "uerokuuriagenipou.firebasestorage.app",
    messagingSenderId: "75955345249",
    appId: "1:75955345249:web:8894881d96ef6a011d9720",
    measurementId: "G-BFQK3DY1V9"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getFirestore(app);

  // ステータス表示の更新
  document.getElementById('sync-status').innerText = "🟢 クラウド接続完了";

  // 1. 日報データをクラウド（Firestore）に保存する関数
  window.saveToCloud = async function() {
    const weekStart = document.getElementById('week-start').value;
    if(!weekStart) return alert("週を選択してください");
    
    document.getElementById('sync-status').innerText = "⏳ 保存中...";
    try {
      // データベースの "weekly_reports" コレクションの中に、選択した日付（例: 2026-06-15）という名前で保存
      await setDoc(doc(db, "weekly_reports", weekStart), {
        hand: savedData.hand,
        vending: savedData.vending,
        updatedAt: new Date().toISOString()
      });
      document.getElementById('sync-status').innerText = "🟢 クラウド同期済み";
      alert("選択された週のデータをクラウドにしっかり本保存しました！");
    } catch (error) {
      console.error("Error saving document: ", error);
      document.getElementById('sync-status').innerText = "❌ 保存失敗";
      alert("保存に失敗しました: " + error.message);
    }
  }

  // 2. 日報データをクラウドから読み込む関数
  window.loadFromCloud = async function() {
    const weekStart = document.getElementById('week-start').value;
    if(!weekStart) return alert("週を選択してください");

    document.getElementById('sync-status').innerText = "⏳ 読み込み中...";
    try {
      const docRef = doc(db, "weekly_reports", weekStart);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        const data = docSnap.data();
        savedData.hand = data.hand || {};
        savedData.vending = data.vending || {};
        renderTables();
        document.getElementById('sync-status').innerText = "🟢 クラウドデータ反映完了";
        alert("クラウドからデータを読み込み、画面に反映しました！");
      } else {
        savedData = { hand: {}, vending: {} };
        renderTables();
        document.getElementById('sync-status').innerText = "🟡 クラウドにデータなし（新規作成）";
        alert("この週のデータはまだクラウドにありません。新しい日報として開始します。");
      }
    } catch (error) {
      console.error("Error loading document: ", error);
      document.getElementById('sync-status').innerText = "❌ 読み込み失敗";
    }
  }

  // 3. 商品マスターをクラウドに保存する関数（任意）
  window.saveMasterToCloud = async function() {
    try {
      await setDoc(doc(db, "master_settings", "products"), {
        handProducts: handProducts,
        vendingProducts: vendingProducts
      });
      alert("商品マスターの現在の構成をクラウドにバックアップしました！");
    } catch (error) {
      alert("マスター保存失敗: " + error.message);
    }
  }
</script>
